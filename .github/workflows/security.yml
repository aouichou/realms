# ──────────────────────────────────────────────────────────────
# Security Scanning Pipeline
# CodeQL + pip-audit + npm audit + Trivy
# ──────────────────────────────────────────────────────────────
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # ReDoS in pygments archetype lexer — disputed, no fix release yet

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.actor, 'dependabot')
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Audit npm dependencies
        run: |
          set +e
          REPORT=$(npm audit --json 2>/dev/null)
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi
          # Filter out the known brace-expansion chain (GHSA-mh99-v99m-4gvg)
          echo "$REPORT" | python3 -c "
import sys, json
data = json.load(sys.stdin)
vulns = data.get('vulnerabilities', {})
# Collect all advisory URLs we want to suppress
SUPPRESSED_GHSA = {'GHSA-mh99-v99m-4gvg'}
suppressed_urls = set()
# Find packages directly affected by suppressed advisories
suppressed_pkgs = set()
for name, v in vulns.items():
    for via in v.get('via', []):
        if isinstance(via, dict):
            for g in SUPPRESSED_GHSA:
                if g in via.get('url', ''):
                    suppressed_urls.add(via.get('url', ''))
                    suppressed_pkgs.add(name)
# Propagate: any package whose via chain only references suppressed packages is also suppressed
changed = True
while changed:
    changed = False
    for name, v in vulns.items():
        if name in suppressed_pkgs:
            continue
        via_names = {a if isinstance(a, str) else a.get('name', '') for a in v.get('via', [])}
        if v['severity'] in ('high', 'critical') and via_names.issubset(suppressed_pkgs | {''}):
            suppressed_pkgs.add(name)
            changed = True
# Check for remaining high/critical vulns not in the suppressed chain
remaining = {k: v for k, v in vulns.items()
             if k not in suppressed_pkgs and v['severity'] in ('high', 'critical')}
if remaining:
    print(f'Unresolved high/critical vulnerabilities: {list(remaining.keys())}')
    sys.exit(1)
else:
    print('Only known suppressed advisory chain remains (brace-expansion via eslint)')
    sys.exit(0)
"

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
